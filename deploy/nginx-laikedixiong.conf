# ==========================================
# 来客兄弟 - Nginx 反向代理配置
# 文件位置：/etc/nginx/sites-available/laikedixiong
# 启用：ln -s /etc/nginx/sites-available/laikedixiong /etc/nginx/sites-enabled/
# 
# 注意：此配置与其它项目完全隔离，通过 server_name 区分流量
# ==========================================

server {
    listen 80;
    server_name lkxdai.com www.lkxdai.com;

    # 访问日志单独存放，不影响其它项目
    access_log /opt/laikedixiong-site/logs/nginx-access.log;
    error_log  /opt/laikedixiong-site/logs/nginx-error.log;

    # 上传大小限制
    client_max_body_size 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js|woff2?)$ {
        proxy_pass http://127.0.0.1:3002;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
